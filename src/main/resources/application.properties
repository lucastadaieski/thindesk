# ThinDesk - configurações
# Credenciais nunca ficam no código: use variáveis de ambiente ou o arquivo .env (fora do Git).
spring.application.name=thindesk
spring.config.import=optional:file:.env[.properties]

# Versão do sistema (vem do pom.xml) exibida no rodapé da sidebar
app.versao=@project.version@

# Porta: o Render (e outros provedores) informa a porta na variável PORT
server.port=${PORT:8080}
# Atrás do proxy HTTPS do provedor de deploy, gera redirecionamentos com https
server.forward-headers-strategy=framework
server.servlet.session.timeout=60m

# MongoDB Atlas. Sem MONGODB_URI, o sistema usa um MongoDB em memória (ver MongoEmMemoriaConfig)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:thindesk}
spring.data.mongodb.auto-index-creation=true

# Usuários de demonstração criados na primeira execução (troque as senhas no deploy)
app.demo.senha-admin=${SENHA_ADMIN:admin123}
app.demo.senha-tecnico=${SENHA_TECNICO:tecnico123}
app.demo.senha-usuario=${SENHA_USUARIO:usuario123}
# Cria clientes, horários e chamados de exemplo quando o banco está vazio
app.demo.dados-exemplo=${DADOS_EXEMPLO:true}
# Mostra as credenciais de técnico e usuário na tela de login
app.demo.mostrar-credenciais=${MOSTRAR_CREDENCIAIS:true}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Health check usado pelo provedor de deploy
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# O health check só confere se a aplicação está no ar (não depende do banco)
management.health.mongo.enabled=false
