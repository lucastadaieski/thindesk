<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
<div th:replace="~{fragments/comum :: toggle}"></div>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

<main id="content">
    <h2 class="mb-4">Clientes</h2>
    <div th:replace="~{fragments/comum :: alertas}"></div>

    <div class="card card-painel mb-3" sec:authorize="hasAnyRole('TECNICO','ADMIN')">
        <div class="card-body">
            <form th:action="@{/clientes/salvar}" th:object="${novoCliente}" method="post" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label for="setor" class="form-label">Setor</label>
                    <input type="text" id="setor" th:field="*{setor}" class="form-control">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card card-painel">
        <table class="table table-striped align-middle mb-0">
            <thead><tr><th>Nome</th><th>Telefone</th><th>Setor</th><th sec:authorize="hasRole('ADMIN')"></th></tr></thead>
            <tbody>
            <tr th:if="${clientes.isEmpty()}"><td colspan="4" class="text-center text-muted py-4">Nenhum cliente cadastrado.</td></tr>
            <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.nome}"></td>
                <td th:text="${cliente.telefone}"></td>
                <td th:text="${cliente.setor}"></td>
                <td class="text-end" sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/clientes/excluir/{id}(id=${cliente.id})}" method="post" data-confirmar="Excluir este cliente?">
                        <button type="submit" class="btn btn-danger btn-sm"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{fragments/comum :: scripts}"></th:block>
</body>
</html>
