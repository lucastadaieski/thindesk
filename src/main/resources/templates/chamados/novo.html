<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Novo chamado')}"></head>
<body>
<div th:replace="~{fragments/comum :: toggle}"></div>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

<main id="content">
    <h2 class="mb-4">Novo chamado</h2>

    <div class="card card-painel" style="max-width: 800px">
        <div class="card-body">
            <form th:action="@{/chamados/novo}" th:object="${form}" method="post" novalidate>
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" id="titulo" th:field="*{titulo}" class="form-control"
                           th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'" maxlength="100">
                    <div class="invalid-feedback" th:errors="*{titulo}"></div>
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" rows="5" class="form-control"
                              th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{descricao}"></div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" th:field="*{tipo}" class="form-select"
                                th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="t : ${tipos}" th:value="${t.nome}" th:text="${t.nome}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{tipo}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="prioridade" class="form-label">Prioridade</label>
                        <select id="prioridade" th:field="*{prioridade}" class="form-select">
                            <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p.descricao}"></option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cliente" class="form-label">Cliente / setor</label>
                        <select id="cliente" th:field="*{cliente}" class="form-select">
                            <option value="">Não informado</option>
                            <option th:each="c : ${clientes}" th:value="${c.nome}" th:text="${c.nome}"></option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Abrir chamado</button>
                    <a th:href="@{/chamados}" class="btn btn-outline-secondary">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/comum :: scripts}"></th:block>
</body>
</html>
