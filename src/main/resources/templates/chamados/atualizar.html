<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Chamado')}"></head>
<body>
<div th:replace="~{fragments/comum :: toggle}"></div>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

<main id="content">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="mb-0" th:text="${chamado.titulo}">Chamado</h2>
        <a th:href="@{/chamados}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
    </div>

    <div th:replace="~{fragments/comum :: alertas}"></div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="card card-painel mb-3">
                <div class="card-body">
                    <div class="mb-3 d-flex flex-wrap gap-2">
                        <span class="badge fs-6" th:classappend="'text-bg-' + ${chamado.status.cor}" th:text="${chamado.status.descricao}">Status</span>
                        <span th:if="${chamado.prioridade}" class="badge fs-6" th:classappend="'text-bg-' + ${chamado.prioridade.cor}"
                              th:text="'Prioridade ' + ${chamado.prioridade.descricao}">Prioridade</span>
                    </div>
                    <h6 class="text-muted">Descrição</h6>
                    <p class="texto-quebra" th:text="${chamado.descricao}">Descrição</p>

                    <div th:if="${chamado.solucao}">
                        <h6 class="text-muted mt-4">Solução</h6>
                        <p class="texto-quebra mb-0" th:text="${chamado.solucao}">Solução</p>
                    </div>
                </div>
            </div>

            <!-- Atendimento (técnico ou administrador) -->
            <div class="card card-painel" sec:authorize="hasAnyRole('TECNICO','ADMIN')" th:unless="${chamado.finalizado}">
                <div class="card-header bg-white fw-semibold">Atendimento</div>
                <div class="card-body">
                    <form th:if="${chamado.status.name() == 'ABERTO'}" th:action="@{/chamados/{id}/assumir(id=${chamado.id})}"
                          method="post" class="mb-3">
                        <button type="submit" class="btn btn-warning"><i class="bi bi-person-check"></i> Assumir chamado</button>
                    </form>
                    <form th:action="@{/chamados/{id}/concluir(id=${chamado.id})}" method="post">
                        <label for="solucao" class="form-label">Solução aplicada</label>
                        <textarea id="solucao" name="solucao" rows="3" class="form-control mb-2" required></textarea>
                        <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Concluir chamado</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card card-painel">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><small class="text-muted d-block">Tipo</small><span th:text="${chamado.tipo}"></span></li>
                    <li class="list-group-item"><small class="text-muted d-block">Cliente / setor</small><span th:text="${chamado.cliente} ?: '-'"></span></li>
                    <li class="list-group-item"><small class="text-muted d-block">Usuário</small><span th:text="${chamado.usuario}"></span></li>
                    <li class="list-group-item"><small class="text-muted d-block">Técnico</small><span th:text="${chamado.tecnico} ?: 'Aguardando atendimento'"></span></li>
                    <li class="list-group-item"><small class="text-muted d-block">Abertura</small>
                        <span th:text="${chamado.dataAbertura} ? ${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')} : '-'"></span></li>
                    <li class="list-group-item"><small class="text-muted d-block">Última atualização</small>
                        <span th:text="${chamado.dataAtualizacao} ? ${#temporals.format(chamado.dataAtualizacao, 'dd/MM/yyyy HH:mm')} : '-'"></span></li>
                    <li class="list-group-item" th:if="${chamado.dataConclusao}"><small class="text-muted d-block">Conclusão</small>
                        <span th:text="${#temporals.format(chamado.dataConclusao, 'dd/MM/yyyy HH:mm')}"></span></li>
                </ul>
                <div class="card-body" th:unless="${chamado.finalizado}">
                    <form th:action="@{/chamados/{id}/cancelar(id=${chamado.id})}" method="post"
                          data-confirmar="Cancelar este chamado?">
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100"><i class="bi bi-x-circle"></i> Cancelar chamado</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/comum :: scripts}"></th:block>
</body>
</html>
