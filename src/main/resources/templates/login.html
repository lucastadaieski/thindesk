<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>
<div class="login-container">
    <div class="login-card text-center">
        <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
        <h3 class="mb-4">Bem-vindo</h3>

        <div th:if="${param.erro}" class="alert alert-danger py-2">E-mail ou senha inválidos.</div>
        <div th:if="${param.saiu}" class="alert alert-success py-2">Você saiu do sistema.</div>

        <form th:action="@{/login}" method="post" class="text-start">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="Digite seu e-mail" required autofocus>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha"
                       placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>

        <div th:if="${mostrarCredenciais}" class="mt-4 p-3 bg-light rounded text-start small">
            <div class="fw-semibold mb-1"><i class="bi bi-info-circle"></i> Acesso de demonstração</div>
            <div>Técnico: <code>tecnico@thindesk.com</code> / <code th:text="${senhaTecnico}"></code></div>
            <div>Usuário: <code>usuario@thindesk.com</code> / <code th:text="${senhaUsuario}"></code></div>
        </div>
    </div>
</div>
</body>
</html>
