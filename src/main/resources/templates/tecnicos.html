<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Técnicos')}"></head>
<body>
<div th:replace="~{fragments/comum :: toggle}"></div>
<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

<main id="content">
    <h2 class="mb-4">Técnicos e usuários</h2>
    <div th:replace="~{fragments/comum :: alertas}"></div>

    <div class="card card-painel mb-3" sec:authorize="hasRole('ADMIN')">
        <div class="card-header bg-white fw-semibold">Cadastrar usuário</div>
        <div class="card-body">
            <form th:action="@{/tecnicos/salvar}" th:object="${form}" method="post" class="row g-2" novalidate>
                <div class="col-md-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" class="form-control"
                           th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>
                <div class="col-md-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-md-2">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" id="senha" name="senha" class="form-control"
                           th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{senha}"></div>
                </div>
                <div class="col-md-2">
                    <label for="perfil" class="form-label">Perfil</label>
                    <select id="perfil" th:field="*{perfil}" class="form-select">
                        <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="setorUsuario" class="form-label">Setor</label>
                    <input type="text" id="setorUsuario" name="setor" th:value="*{setor}" class="form-control">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus"></i> Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card card-painel">
        <table class="table table-striped align-middle mb-0">
            <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Setor</th></tr></thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nome}"></td>
                <td th:text="${u.email}"></td>
                <td><span class="badge text-bg-light border" th:text="${u.perfil.descricao}"></span></td>
                <td th:text="${u.setor} ?: '-'"></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<th:block th:replace="~{fragments/comum :: scripts}"></th:block>
</body>
</html>
