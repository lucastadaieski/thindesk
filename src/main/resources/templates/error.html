<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Erro')}"></head>
<body>
<div class="login-container">
    <div class="login-card text-center">
        <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
        <h1 class="display-5" th:text="${status}">Erro</h1>
        <p th:switch="${status}" class="mb-4">
            <span th:case="403">Você não tem permissão para acessar esta página.</span>
            <span th:case="404">Página ou registro não encontrado.</span>
            <span th:case="*">Ocorreu um erro inesperado. Tente novamente.</span>
        </p>
        <a th:href="@{/}" class="btn btn-primary">Voltar ao início</a>
    </div>
</div>
</body>
</html>
